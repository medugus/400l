<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FBCS Student Check-in</title>
<meta name="theme-color" content="#0f172a">
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#0f172a;background:#f1f5f9}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:460px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;margin-top:8vh}.muted{color:#64748b;font-size:13px}.title{font-size:27px;font-weight:800;margin:6px 0 2px}label{display:block;font-size:12px;color:#475569;margin:14px 0 5px}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}.btn{width:100%;border:0;border-radius:10px;padding:13px 16px;font-weight:750;background:#0f172a;color:#fff;margin-top:16px;font-size:16px}.btn:disabled{opacity:.6}.ok{background:#dcfce7;color:#166534;border:1px solid #86efac;border-radius:12px;padding:14px;margin-top:16px}.err{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;border-radius:12px;padding:14px;margin-top:16px}.brand{text-align:center;color:#64748b;font-size:11px;margin-top:14px}
</style>
</head>
<body><div class="wrap"><div class="card">
<div class="muted">Nile University · FBCS Roll Call</div>
<div class="title">Student attendance check-in</div>
<div class="muted">Enter your own matric number and surname. The QR is time-limited.</div>
<form id="f">
<label>Matric number</label>
<input id="matric" autocomplete="off" required>
<label>Surname</label>
<input id="surname" autocomplete="family-name" required>
<button id="btn" class="btn">Check in</button>
</form>
<div id="msg"></div>
</div><div class="brand">This check-in records the time and attendance method.</div></div>
<script>
const URL='https://ktlynfdhhfwqnhtkgauy.supabase.co';
const KEY='sb_publishable_5rmnEy05iKgq7bcCHYfQzw_Anumymr5';
const p=new URLSearchParams(location.search),sid=p.get('sid'),token=p.get('token');
const msg=document.getElementById('msg'),form=document.getElementById('f'),btn=document.getElementById('btn');
function show(kind,text){msg.className=kind;msg.textContent=text}
if(!sid||!token){form.style.display='none';show('err','This attendance link is incomplete. Please scan the current QR code again.')}
form?.addEventListener('submit',async e=>{
 e.preventDefault();
 btn.disabled=true;btn.textContent='Checking…';msg.className='';msg.textContent='';
 try{
   const r=await fetch(URL+'/functions/v1/student-qr-checkin',{
     method:'POST',
     headers:{'Content-Type':'application/json','apikey':KEY},
     body:JSON.stringify({session_id:sid,token,student_id:document.getElementById('matric').value.trim(),surname:document.getElementById('surname').value.trim()})
   });
   const b=await r.json();
   if(!r.ok)throw Error(b.error||'Check-in failed');
   form.style.display='none';
   show('ok',b.already_checked_in?'You are already checked in for this register.':'Attendance recorded successfully for '+b.student_name+'.');
 }catch(e){show('err',e.message);btn.disabled=false;btn.textContent='Check in'}
});
</script></body></html>
